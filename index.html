          <div class="form-row">
            <div class="form-group"><label>Work from Home (hrs/week)</label><input type="number" id="wfhHrs" placeholder="0" min="0" oninput="calcDeductions()"></div>
            <div class="form-group"><label>Work-related Expenses ($)</label><input type="number" id="workExp" placeholder="0" min="0" oninput="calcDeductions()"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Charitable Donations ($)</label><input type="number" id="donations" placeholder="0" min="0" oninput="calcDeductions()"></div>
            <div class="form-group"><label>Other Deductions ($)</label><input type="number" id="otherDed" placeholder="0" min="0" oninput="calcDeductions()"></div>
          </div>
          <div id="deductionResult"></div>
        </div>

        <div class="card">
          <h2>Disclaimer</h2>
          <p class="text-muted" style="font-size:13px;">Rough estimate only. Does not account for HECS-HELP (above is separate), investment income, rental income, business income, or your specific circumstances. Always use myTax at ato.gov.au or a registered tax agent for your actual return.</p>
        </div>`;
    }
    function applyTaxIncome() {
      const val = parseFloat(document.getElementById('taxIncomeInput')?.value);
      if (!val || val <= 0) { showToast('Enter a valid annual income', 'error'); return; }
      taxCustomIncome = val;
      renderMain();
      showToast('✓ Income updated', 'success');
    }
    function resetTaxIncome() {
      taxCustomIncome = null;
      renderMain();
      showToast('✓ Reset to app income', 'success');
    }
    function calcHECS() {
      const bal = parseFloat(document.getElementById('hecsBalance')?.value) || 0;
      if (bal <= 0) { document.getElementById('hecsResult').innerHTML = ''; return; }
      const income = getTaxIncome();
      // 2024-25 HECS repayment thresholds
      const rates = [
        [54,435,0],[62,739,0.01],[66,308,0.02],[70,085,0.025],[74,990,0.03],[79,207,0.035],
        [83,985,0.04],[88,524,0.045],[93,000,0.05],[97,001,0.055],[101,046,0.06],[105,289,0.065],
        [109,958,0.07],[114,957,0.075],[119,882,0.08],[124,728,0.085],[129,878,0.09],[134,944,0.095],[999999,0.10]
      ];
      let rate = 0;
      for (const [threshold, r] of rates) { if (income <= threshold * 1000) { rate = r; break; } }
      if (income < 54435) { document.getElementById('hecsResult').innerHTML = '<div style="padding:0.75rem;background:var(--surface);border-radius:8px;font-size:13px;color:var(--success-dark);">Below repayment threshold — no mandatory repayment this year.</div>'; return; }
      const annual = Math.round(income * rate);
      const monthly = Math.round(annual / 12);
      const fortnightly = Math.round(annual / 26);
      const yearsToPayoff = bal / annual;
      document.getElementById('hecsResult').innerHTML = `
        <div style="padding:1rem;background:var(--surface);border-radius:10px;border-left:3px solid var(--warning);">
          <div class="flex-between" style="margin-bottom:0.5rem;"><span style="font-weight:600;">Repayment rate</span><span style="font-weight:700;">${(rate*100).toFixed(1)}% of income</span></div>
          <div class="flex-between" style="margin-bottom:0.5rem;"><span>Annual repayment</span><span class="num" style="font-weight:600;">${AUD(annual)}</span></div>
          <div class="flex-between" style="margin-bottom:0.5rem;"><span>Monthly (approx)</span><span class="num" style="font-weight:600;">${AUD(monthly)}</span></div>
          <div class="flex-between" style="margin-bottom:0.5rem;"><span>Fortnightly (approx)</span><span class="num" style="font-weight:600;">${AUD(fortnightly)}</span></div>
          <div class="flex-between"><span>Est. payoff</span><span style="font-weight:700;">${yearsToPayoff < 1 ? 'Under 1 year' : yearsToPayoff.toFixed(1) + ' years'}</span></div>
        </div>`;
    }
    function calcDeductions() {
      const wfh = (parseFloat(document.getElementById('wfhHrs')?.value)||0) * 52 * 0.67;
      const workExp = parseFloat(document.getElementById('workExp')?.value)||0;
      const donations = parseFloat(document.getElementById('donations')?.value)||0;
      const other = parseFloat(document.getElementById('otherDed')?.value)||0;
      const total = wfh + workExp + donations + other;
      if (total <= 0) { document.getElementById('deductionResult').innerHTML = ''; return; }
      const income = getTaxIncome();
      const taxBefore = calcTax(income);
      const taxAfter = calcTax(Math.max(0, income - total));
      const saving = Math.max(0, taxBefore - taxAfter);
      const newIncome = Math.max(0, income - total);
      document.getElementById('deductionResult').innerHTML = `
        <div style="margin-top:1rem;padding:1rem;background:var(--surface);border-radius:10px;border-left:3px solid var(--success);">
          <div class="flex-between" style="margin-bottom:0.5rem;"><span style="font-weight:600;">Total deductions</span><span class="num" style="font-weight:700;">${AUD(Math.round(total))}</span></div>
          <div class="flex-between" style="margin-bottom:0.5rem;"><span>Taxable income after deductions</span><span class="num" style="font-weight:600;">${AUD(Math.round(newIncome))}</span></div>
          <div class="flex-between"><span style="font-weight:700;">Estimated tax saving</span><span class="num" style="font-weight:700;color:var(--success);font-size:16px;">~${AUD(Math.round(saving))}</span></div>
        </div>`;
    }

    // ═══════════════════════════════════════════════════════════════
    // DEBT MILESTONE DISPLAY (injected into debt cards)
    // ═══════════════════════════════════════════════════════════════
    function getMilestonesForDebt(debtId) {
      return Object.entries(debtMilestones).filter(([k]) => k.startsWith(debtId + '_')).map(([k, v]) => v);
    }


    // ═══════════════════════════════════════════════════════════════
    // INTEREST COST COUNTER
    // ═══════════════════════════════════════════════════════════════
    function dailyInterest() {
      return debts.reduce((s, d) => s + (d.balance || 0) * (d.rate || 0) / 100 / 365, 0);
    }
    function weeklyInterest() { return dailyInterest() * 7; }
    function monthlyInterestCost() {
      return debts.reduce((s, d) => s + (d.balance || 0) * (d.rate || 0) / 100 / 12, 0);
    }

    // ═══════════════════════════════════════════════════════════════
    // NET WORTH MILESTONE CHECK
    // ═══════════════════════════════════════════════════════════════
    function checkNetWorthMilestones() {
      const nw = netWorth();
      const marks = [0, 5000, 10000, 25000, 50000, 100000, 250000, 500000];
      marks.forEach(m => {
        const key = 'nw_' + m;
        if (nw >= m && !netWorthMilestones[key]) {
          netWorthMilestones[key] = { value: m, date: today() };
          saveNetWorthMilestones();
          if (m === 0) showToast('Net worth crossed $0 — you\'re in the green!', 'success');
          else showToast('Net worth hit ' + AUD(m) + '!', 'success');
        }
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // BILL AUTO-RESET (1st of each month)
    // ═══════════════════════════════════════════════════════════════
    function autoResetBills() {
      const now = new Date();
      if (now.getDate() !== 1) return;
      const key = getMonthKey();
      const resetKey = 'autoReset_' + key;
      if (localStorage.getItem(resetKey)) return;
      let changed = false;
      bills.forEach(b => { if (b.paid) { b.paid = false; b.paidDate = ''; changed = true; } });
      if (changed) { saveBills(); showToast('Bills reset for new month', 'success'); }
      localStorage.setItem(resetKey, '1');
    }

    // ═══════════════════════════════════════════════════════════════
    // PAYDAY AUTOMATION CHECKLIST
    // ═══════════════════════════════════════════════════════════════
    function renderPaydayChecklist() {
      const fk = getFortnightKey();
      const done = paydayChecklistDone[fk] || {};
      const sorted = getSortedDebts();
      const focusDebt = sorted[0];
      const extra = Math.max(0, fortnightlySurplus() - totalGoalSavingsPerFortnight());
      const goalItems = goals.filter(g => !g.achieved && g.dueDate).slice(0, 3).map(g => {
        const fn = fortnightsUntil(g.dueDate);
        const rem = Math.max(0, (g.targetAmount || 0) - (g.savedAmount || 0));
        const perFn = fn && fn > 0 ? rem / fn : rem;
        return { key: 'goal_' + g.id, label: 'Transfer' + AUD(perFn) + ' → ' + g.name, amount: perFn };
      });

              <div style="flex:1;">

    // ═══════════════════════════════════════════════════════════════
    // DEBT PAYOFF TIMELINE
    // ═══════════════════════════════════════════════════════════════
    function renderDebtTimeline() {
      if (debts.length === 0) return '<div class="card"><p class="text-muted text-center">No debts added yet.</p></div>';
      const sorted = getSortedDebts();
      const extraMonthly = Math.max(0, monthlySurplus() * 0.5);
      let remaining = extraMonthly;
      const timeline = [];
      const now = new Date();
      sorted.forEach((d, i) => {
        let balance = d.balance || 0;
        const minMonthly = toMonthly(d.minPayment, d.minFreq || 'monthly');
        const extra = i === 0 ? remaining : 0;
        const payment = minMonthly + extra;
        const rate = (d.rate || 0) / 100 / 12;
        let months = 0;
        let totalInterest = 0;
        let bal = balance;
        while (bal > 0 && months < 600) {
          const interest = bal * rate;
          totalInterest += interest;
          bal -= (payment - interest);
          months++;
        }
        const payoffDate = new Date(now);
        payoffDate.setMonth(payoffDate.getMonth() + months);
        timeline.push({ ...d, months, totalInterest, payoffDate, payment, extra });
        remaining += minMonthly; // snowball freed payment
      });
      const maxMonths = Math.max(...timeline.map(t => t.months), 1);
      const colors = ['#FF3B30','#F97316','#FF9500','#34C759','#0F95A8','#5E5CE6'];
      return `
        <div class="card" style="background: linear-gradient(135deg, var(--text) 0%, #2C2C2E 100%);color:white;border-radius:16px;">
          <h2 style="color:white;">Debt Payoff Timeline</h2>
          <p style="opacity:0.8;font-size:13px;margin-top:0.25rem;">${debtMethod === 'avalanche' ? 'Avalanche' : 'Snowball'} method · surplus rolled into next debt</p>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.5rem;">
            <div style="text-align:center;background:rgba(255,255,255,0.1);border-radius:10px;padding:1rem;">
              <div style="font-size:11px;opacity:0.7;text-transform:uppercase;">Total Debt</div>
              <div style="font-size:20px;font-weight:700;margin-top:0.25rem;" class="num">${AUD(totalDebt())}</div>
            </div>
            <div style="text-align:center;background:rgba(255,255,255,0.1);border-radius:10px;padding:1rem;">
              <div style="font-size:11px;opacity:0.7;text-transform:uppercase;">Total Interest</div>
              <div style="font-size:20px;font-weight:700;margin-top:0.25rem;" class="num">${AUD(Math.round(timeline.reduce((s,t) => s+t.totalInterest, 0)))}</div>
            </div>
            <div style="text-align:center;background:rgba(255,255,255,0.1);border-radius:10px;padding:1rem;">
              <div style="font-size:11px;opacity:0.7;text-transform:uppercase;">Debt Free</div>
              <div style="font-size:16px;font-weight:700;margin-top:0.25rem;">${timeline.length > 0 ? timeline[timeline.length-1].payoffDate.toLocaleDateString('en-AU',{month:'short',year:'numeric'}) : '—'}</div>
            </div>
          </div>
        </div>
        <div class="card">
          <h2>Visual Timeline</h2>
          ${timeline.map((t, i) => {
            const widthPct = Math.min(100, (t.months / maxMonths) * 100);
            const milestones = getMilestonesForDebt(t.id);
            return `
              <div style="margin-bottom:1.5rem;">
                <div class="flex-between" style="margin-bottom:0.5rem;">
                  <div>
                    <span style="font-weight:700;">${i+1}. ${t.name}</span>
                    ${milestones.map(m => `<span class="milestone-badge" style="margin-left:0.5rem;">${m.pct}% ✓</span>`).join('')}
                  </div>
                  <div style="text-align:right;font-size:13px;">
                    <div class="num" style="font-weight:700;">${AUD(t.balance)}</div>
                    <div style="color:var(--text-muted);">${t.months}mo · ${t.payoffDate.toLocaleDateString('en-AU',{month:'short',year:'numeric'})}</div>
                  </div>
                </div>
                <div style="height:28px;background:var(--border-soft);border-radius:8px;overflow:hidden;position:relative;">
                  <div style="height:100%;width:${widthPct}%;background:${colors[i%colors.length]};border-radius:8px;display:flex;align-items:center;padding:0 0.75rem;transition:width 0.6s ease;">
                    <span style="color:white;font-size:11px;font-weight:600;white-space:nowrap;">${t.rate}% · ${AUD(t.payment)}/mo</span>
                  </div>
                </div>
                <div style="font-size:11px;color:var(--text-dim);margin-top:0.3rem;">Interest cost: ${AUD(Math.round(t.totalInterest))} · freed payment after: ${AUD(t.payment)}/mo</div>
              </div>`;
          }).join('')}
        </div>
        <div class="card">
          <h2>Month-by-Month Breakdown</h2>
          <div style="overflow-x:auto;">
            <table>
              <thead><tr><th>Debt</th><th>Balance</th><th>Rate</th><th>Payment/mo</th><th>Payoff Date</th><th>Interest Cost</th></tr></thead>
              <tbody>${timeline.map((t,i) => `
                <tr>
                  <td><strong>${i+1}. ${t.name}</strong></td>
                  <td class="num">${AUD(t.balance)}</td>
                  <td style="color:var(--danger);">${t.rate}%</td>
                  <td class="num">${AUD(Math.round(t.payment))}/mo</td>
                  <td><strong>${t.payoffDate.toLocaleDateString('en-AU',{month:'short',year:'numeric'})}</strong></td>
                  <td class="num" style="color:var(--danger);">${AUD(Math.round(t.totalInterest))}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    // ═══════════════════════════════════════════════════════════════
    // CATEGORY SPENDING TRENDS
    // ═══════════════════════════════════════════════════════════════
    function renderTrends() {
      const categories = ['Food','Transport','Entertainment','Shopping','Housing','Utilities','Health','Other'];
      const sixMonths = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(); d.setMonth(d.getMonth()-i);
        sixMonths.push(getMonthKey(d));
      }
      const incomeVariance = () => {
        const myPays = variableIncome.filter(v => v.type === 'my').map(v => v.amount);
        if (myPays.length < 2) return 0;
        const avg = myPays.reduce((s,a) => s+a, 0) / myPays.length;
        const variance = myPays.reduce((s,a) => s + Math.pow(a-avg,2), 0) / myPays.length;
        return Math.round(Math.sqrt(variance));
      };
      const variance = incomeVariance();
      const buffer = variance * 2;
      return `
        <div class="card">
          <h2>6-Month Spending by Category</h2>
          <p class="text-muted" style="font-size:13px;margin-bottom:1.5rem;">See which categories are creeping up month over month.</p>
          <canvas id="trendsChart" height="100"></canvas>
        </div>
        <div class="card">
          <h2>Category Detail</h2>
          <div style="overflow-x:auto;">
            <table>
              <thead><tr><th>Category</th>${sixMonths.map(m => `<th style="text-align:right;">${new Date(m+'-01').toLocaleDateString('en-AU',{month:'short'})}</th>`).join('')}<th style="text-align:right;">Trend</th></tr></thead>
              <tbody>${categories.map(cat => {
                const monthly = sixMonths.map(m => transactions.filter(t => t.type==='expense' && t.category===cat && getMonthKey(new Date(t.date+'T00:00:00'))===m).reduce((s,t)=>s+t.amount,0));
                const first = monthly[0] || 0;
                const last = monthly[monthly.length-1] || 0;
                const trend = first === 0 ? 0 : Math.round(((last-first)/first)*100);
                const hasData = monthly.some(v => v > 0);
                if (!hasData) return '';
                return `<tr>
                  <td><strong>${cat}</strong></td>
                  ${monthly.map(v => `<td style="text-align:right;" class="num">${v > 0 ? AUD(v) : '—'}</td>`).join('')}
                  <td style="text-align:right;font-weight:700;color:${trend > 10 ? 'var(--danger)' : trend < -10 ? 'var(--success)' : 'var(--text-muted)'};">${trend > 0 ? '▲' : trend < 0 ? '▼' : '—'}${Math.abs(trend)}%</td>
                </tr>`;
              }).join('')}</tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <h2>Income Stability Score</h2>
          ${variance === 0 ? '<p class="text-muted">Log at least 2 pay cycles to see your stability score.</p>' : `
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem;">
            <div style="text-align:center;padding:1rem;background:var(--bg);border-radius:10px;">
              <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Pay Variance</div>
              <div style="font-size:20px;font-weight:700;margin-top:0.25rem;" class="num">±${AUD(variance)}</div>
            </div>
            <div style="text-align:center;padding:1rem;background:var(--bg);border-radius:10px;">
              <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Recommended Buffer</div>
              <div style="font-size:20px;font-weight:700;margin-top:0.25rem;color:var(--warning);" class="num">${AUD(buffer)}</div>
            </div>
            <div style="text-align:center;padding:1rem;background:var(--bg);border-radius:10px;">
              <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Stability</div>
              <div style="font-size:20px;font-weight:700;margin-top:0.25rem;color:${variance < 200 ? 'var(--success)' : variance < 500 ? 'var(--warning)' : 'var(--danger)'};">${variance < 200 ? 'Stable' : variance < 500 ? 'Moderate' : 'Variable'}</div>
            </div>
          </div>
          <div style="padding:0.75rem 1rem;background:var(--surface);border-radius:8px;border-left:3px solid var(--warning);font-size:13px;">
            Keep <strong>${AUD(buffer)}</strong> as a buffer in your everyday account to handle low pay weeks without touching debt payments or savings.
          </div>`}
        </div>
        <div class="card">
          <h2>Net Worth Milestones</h2>
          ${Object.keys(netWorthMilestones).length === 0 ? '<p class="text-muted">No milestones reached yet. Keep going!</p>' :
            Object.values(netWorthMilestones).sort((a,b) => a.value - b.value).map(m => `
              <div class="flex-between" style="padding:0.75rem 0;border-bottom:1px solid var(--border);">
                <div style="display:flex;align-items:center;gap:0.75rem;">
                  <span style="width:8px;height:8px;border-radius:50%;background:var(--warning);display:inline-block;"></span>
                  <div><div style="font-weight:600;">Net worth hit ${AUD(m.value)}</div><div style="font-size:12px;color:var(--text-muted);">${m.date}</div></div>
                </div>
              </div>`).join('')}
        </div>`;
    }
    function renderTrendCharts() {
      const categories = ['Food','Transport','Entertainment','Shopping','Housing','Utilities','Health','Other'];
      const colors = ['#0F95A8','#34C759','#FF9500','#FF3B30','#5E5CE6','#EC4899','#14B8A6','#6366F1'];
      const sixMonths = [];
      for (let i = 5; i >= 0; i--) { const d = new Date(); d.setMonth(d.getMonth()-i); sixMonths.push(getMonthKey(d)); }
      const labels = sixMonths.map(m => new Date(m+'-01').toLocaleDateString('en-AU',{month:'short'}));
      const ctx = document.getElementById('trendsChart')?.getContext('2d');
      if (!ctx) return;
      if (window.trendsChart) window.trendsChart.destroy();
      const datasets = categories.map((cat, i) => ({
        label: cat,
        data: sixMonths.map(m => transactions.filter(t => t.type==='expense' && t.category===cat && getMonthKey(new Date(t.date+'T00:00:00'))===m).reduce((s,t)=>s+t.amount,0)),
        borderColor: colors[i], backgroundColor: colors[i]+'22',
        borderWidth: 2, pointRadius: 3, fill: false, tension: 0.3
      })).filter(d => d.data.some(v => v > 0));
      window.trendsChart = new Chart(ctx, {
        type: 'line', data: { labels, datasets },
        options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { color:'#6E6E73', callback: v => '$'+v }, grid: { color:'#D2D2D7' } }, x: { ticks: { color:'#6E6E73' }, grid: { display:false } } }, plugins: { legend: { labels: { font: { family:'-apple-system', size:10 }, color:'#1D1D1F', padding:8 } } } }
      });
    }

    async function calcCurrency() {
      const amount = parseFloat(document.getElementById('currAmount')?.value) || 0;
      const from = document.getElementById('currFrom')?.value || 'AUD';
      const to = document.getElementById('currTo')?.value || 'USD';
      if (amount <= 0) { document.getElementById('currResult').innerHTML = ''; return; }
      document.getElementById('currResult').innerHTML = '<div style="color:var(--text-muted);font-size:13px;">Loading rates...</div>';
      try {
        const res = await fetch('https://api.exchangerate-api.com/v4/latest/' + from);
        const data = await res.json();
        const rate = data.rates[to];
        if (!rate) throw new Error('Rate not found');
        const converted = amount * rate;
        const wiseFee = amount * 0.006;
        const wiseConverted = (amount - wiseFee) * rate;
        const bankFee = amount * 0.03 + 15;
        const bankConverted = (amount - bankFee) * rate;
        document.getElementById('currResult').innerHTML = `
          <div style="text-align:center;padding:1.5rem;background:var(--surface);border-radius:12px;margin-bottom:1rem;">
            <div style="font-size:13px;color:var(--text-muted);margin-bottom:0.5rem;">${amount} ${from} =</div>
            <div style="font-size:32px;font-weight:700;color:var(--success-dark);">${converted.toLocaleString('en-AU',{maximumFractionDigits:2})} ${to}</div>
            <div style="font-size:12px;color:var(--text-dim);margin-top:0.5rem;">Rate: 1 ${from} = ${rate.toFixed(4)} ${to}</div>
          </div>`;
        document.getElementById('wiseCompare').innerHTML = `
          <div style="display:grid;gap:0.75rem;">
            <div style="padding:1rem;background:var(--surface);border-radius:10px;border-left:3px solid var(--success);">
              <div class="flex-between"><span style="font-weight:600;">Wise</span><span class="num" style="font-weight:700;color:var(--success-dark);">${wiseConverted.toLocaleString('en-AU',{maximumFractionDigits:2})} ${to}</span></div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:0.25rem;">Fee: ~${AUD(wiseFee)} (0.6%) · Real mid-market rate</div>
            </div>

              <div class="flex-between"><span style="font-weight:600;">Typical Bank</span><span class="num" style="font-weight:700;color:var(--danger);">${bankConverted.toLocaleString('en-AU',{maximumFractionDigits:2})} ${to}</span></div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:0.25rem;">Fee: ~${AUD(Math.round(bankFee))} (3% + $15 flat) · Marked-up rate</div>
            </div>
            <div style="padding:0.75rem 1rem;background:var(--surface);border-radius:8px;font-size:13px;" class="flex-between">
              <span style="font-weight:600;">Wise saves you approx.</span>

    // ═══════════════════════════════════════════════════════════════
    // PUSH NOTIFICATIONS
    // ═══════════════════════════════════════════════════════════════
    async function requestNotifications() {
      if (!('Notification' in window)) {
        showToast('Notifications not supported in this browser', 'error'); return;
      }
      const perm = await Notification.requestPermission();
      notificationsEnabled = perm === 'granted';
      const el = document.getElementById('notifStatus');
      if (el) el.innerHTML = perm === 'granted'
        ? '<div style="padding:0.5rem 0.75rem;background:var(--surface);border-radius:6px;font-size:13px;color:var(--success-dark);">Notifications enabled</div>'
        : '<div style="padding:0.5rem 0.75rem;background:var(--surface);border-radius:6px;font-size:13px;color:var(--danger);">Notifications blocked — check browser settings</div>';
      if (perm === 'granted') {
        showToast('✓ Notifications enabled', 'success');
        checkUpcomingBillNotifs();
      }
    }
    function testNotif(type) {
      if (Notification.permission !== 'granted') { showToast('Enable notifications first', 'error'); return; }
      if (type === 'bill') new Notification('FlowFinance', { body: 'Rent is due in 3 days — $1,800', icon: '' });
      if (type === 'payday') new Notification('FlowFinance', { body: 'Payday checklist ready! Open FlowFinance to complete your steps.' });
    }
    function checkUpcomingBillNotifs() {
      if (Notification.permission !== 'granted') return;
      const now = new Date();
      bills.filter(b => b.active && !b.paid).forEach(b => {
        const dueDay = parseInt(b.dueDay);
        const daysLeft = dueDay - now.getDate();
        if (daysLeft === 3) {
          setTimeout(() => new Notification('FlowFinance', { body: b.name + ' due in 3 days — ' + AUD(b.amount) }), 1000);
        }
      });
    }
    function scheduleMonthlyReminder() {
      if (Notification.permission !== 'granted') { showToast('Enable notifications first', 'error'); return; }
      // Schedule for 1st of next month at 9am using setTimeout
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth()+1, 1, 9, 0, 0);
      const ms = next - now;
      setTimeout(() => new Notification('FlowFinance', { body: 'New month! Time for your monthly money review. Open FlowFinance.' }), ms);
      showToast('✓ Monthly reminder scheduled for ' + next.toLocaleDateString('en-AU'), 'success');
    }

    // Main Render
    // ── CFO AGENT ACTIVITY ───────────────────────────────────────────────────
    // Read-only view of what the Telegram CFO backend has been doing. These two
    // collections were already being written by Cloud Functions; nothing in the
    // app could show them, so the only way to see the agents' reasoning was to
    // scroll back through Telegram.
    const SEVERITY_COLOUR = {
      urgent: 'var(--danger)', soon: 'var(--warning)',

    // Progress toward a three-month buffer. Expressed in months of cover as
    // well as dollars — "1.5 months of essential costs" reads better than a
    // bare number.
    function renderEmergencyFundCard() {
      const ef = cfoSnapshot && cfoSnapshot.emergencyFund;

      const pct = Math.max(0, Math.min(100, ef.percentComplete || 0));

        : ef.status === 'building' ? 'var(--warning)' : 'var(--danger)';
      return `<div class="card">
        <div class="flex-between" style="align-items:baseline;">
          <h2 style="margin:0;">Emergency fund</h2>
          <span class="num" style="font-weight:700;">${AUD(ef.currentSavings || 0)} <span class="text-muted" style="font-weight:400;font-size:12px;">of ${AUD(ef.targetAmount || 0)}</span></span>
        </div>
        <div class="progress" style="height:10px;margin:0.85rem 0 0.5rem;">
          <div class="progress-fill" style="width:${pct}%;background:${colour};transition:width .4s ease;"></div>
        </div>
        <div class="flex-between text-muted" style="font-size:12px;">
          <span>${ef.coverageMonths || 0} month${ef.coverageMonths === 1 ? '' : 's'} of essential costs covered</span>

        </div>
        ${!ef.savingsRecorded ? `<div style="margin-top:0.75rem;padding:0.6rem 0.9rem;background:var(--surface);border-left:3px solid var(--warning);border-radius:6px;font-size:12px;">No savings recorded yet. Send <code>savings 4200</code> to the bot to start tracking this.</div>` : ''}
      </div>`;
    }

    // Dated choices rather than transactions. Most financial damage comes from
    // a decision deferred, not a budget missed.
    function renderDecisionsCard(limit) {
      const list = (cfoSnapshot && cfoSnapshot.decisions) || [];
      if (!list.length) return '';
      const shown = limit ? list.slice(0, limit) : list;
      return `<div class="card">
        <div class="flex-between" style="align-items:baseline;">
          <h2 style="margin:0;">Needs a decision</h2>
          <span class="text-muted" style="font-size:12px;">${list.length} open</span>
        </div>
        <div style="margin-top:0.75rem;">
        ${shown.map(d => `
          <div style="padding:0.7rem 0;border-bottom:1px solid var(--border);">
            <div class="flex-between" style="gap:0.75rem;align-items:baseline;">
              <span style="font-weight:600;font-size:13.5px;">
                <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${SEVERITY_COLOUR[d.severity] || 'var(--border)'};margin-right:6px;"></span>${escapeAgentText(d.title)}
              </span>
              <span class="text-muted" style="font-size:11px;white-space:nowrap;">${d.daysUntil == null ? '' : d.daysUntil <= 0 ? 'today' : d.daysUntil + 'd'}</span>
            </div>
            <div class="text-muted" style="font-size:12px;margin-top:0.2rem;">${escapeAgentText(d.detail)}</div>
            ${d.costOfInaction ? `<div style="font-size:11.5px;margin-top:0.25rem;color:${SEVERITY_COLOUR[d.severity] || 'var(--text-muted)'};">${escapeAgentText(d.costOfInaction)}</div>` : ''}
          </div>`).join('')}
        </div>
        ${limit && list.length > limit ? `<div class="text-muted" style="font-size:12px;margin-top:0.6rem;">${list.length - limit} more in the CFO Agent tab.</div>` : ''}
      </div>`;
    }

    function escapeAgentText(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    // The five agents, in the order work flows through them. `role` is written
    // for you, not for the model — this tab is where the multi-agent design
    // stops being an implementation detail and becomes something you can see.
    const AGENT_META = [
      { id: 'expenseAgent', label: 'Expense Agent', tag: '[Expense Agent]', role: 'Turns what you type into a categorised transaction.' },
      { id: 'visionAgent', label: 'Vision Agent', tag: '[Vision Agent]', role: 'Reads receipt photos — amount, merchant, category, date.' },
      { id: 'debtAgent', label: 'Debt Agent', tag: '[Debt Agent]', role: 'Payoff strategy and “what if I paid extra” answers.' },
      { id: 'auditAgent', label: 'Audit Agent', tag: '[Audit Agent]', role: 'Flags spending far outside your normal pattern, same day.' },
      { id: 'cfoSupervisor', label: 'CFO Supervisor', tag: '[CFO]', role: 'Answers your questions and writes the Sunday briefing.' },
    ];

    function timeAgo(iso) {
      if (!iso) return 'never';
      const then = new Date(iso).getTime();
      if (!Number.isFinite(then)) return 'never';
      const mins = Math.floor((Date.now() - then) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.floor(hrs / 24);
      return days === 1 ? 'yesterday' : days + 'd ago';
    }

    // How the pieces fit together. Deliberately shows that the maths happens in
    // deterministic code and Claude only narrates it — that's the core design
    // rule of the whole system, and it's invisible everywhere else.
    function renderAgentPipeline() {
      const box = (x, y, w, h, label, sub, accent) => `
        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="var(--card)" stroke="${accent || 'var(--border)'}" stroke-width="1.5"/>

      <div style="overflow-x:auto;">

        <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" fill="var(--border)"/></marker></defs>

        ${box(10, 100, 96, 46, 'You', 'Telegram', 'var(--accent)')}
        ${arrow(110, 123, 138, 123)}
        ${box(142, 100, 96, 46, 'Router', 'reads intent')}

        ${arrow(242, 123, 268, 40)}
        ${arrow(242, 123, 268, 96)}
        ${arrow(242, 123, 268, 150)}
        ${arrow(242, 123, 268, 206)}
        ${box(272, 18, 132, 44, 'Expense Agent', 'text → transaction')}
        ${box(272, 74, 132, 44, 'Vision Agent', 'photo → transaction')}
        ${box(272, 130, 132, 44, 'Debt Agent', 'payoff & what-ifs')}
        ${box(272, 186, 132, 44, 'Audit Agent', 'anomaly alerts')}

        ${arrow(408, 40, 440, 110)}
        ${arrow(408, 96, 440, 116)}
        ${arrow(408, 152, 440, 128)}
        ${arrow(408, 208, 440, 134)}
        ${box(444, 100, 118, 46, 'CFO Supervisor', 'one directive', 'var(--purple)')}

        ${arrow(566, 123, 596, 123)}
        ${box(600, 100, 110, 46, 'FlowFinance', 'this app', 'var(--success)')}

        <text x="360" y="248" text-anchor="middle" font-size="9.5" fill="var(--text-muted)">All figures are computed in code — the agents only put them into words.</text>
      </svg></div>`;
    }

    // Resolve a pending item the agent wasn't confident about. Writes a normal
    // transaction in this app's own shape, then clears the pending entry.
    async function approvePending(id) {
      const p = (pendingConfirmations || {})[id];
      if (!p) return;
      const d = p.data || {};
      const amount = parseFloat(document.getElementById('pendAmt_' + id)?.value);
      if (!amount || amount <= 0) { showToast('Enter an amount first', 'error'); return; }
      const category = document.getElementById('pendCat_' + id)?.value || d.category || 'Other';

      transactions.push({
        id: Date.now(),
        date: String(d.date || today()).slice(0, 10),
        name: d.merchant || d.name || 'Logged via Telegram',
        amount,
        type: 'expense',
        category,
        note: d.note || '',
        source: p.type === 'receipt' ? 'telegram-photo' : 'telegram-text',
      });
      await saveTx();

      delete pendingConfirmations[id];
      await fbSet('pendingConfirmations', pendingConfirmations);
      showToast('✓ Logged ' + AUD(amount), 'success');
      renderMain();
    }

    async function rejectPending(id) {
      if (!(pendingConfirmations || {})[id]) return;
      delete pendingConfirmations[id];
      await fbSet('pendingConfirmations', pendingConfirmations);
      showToast('Discarded', 'success');
      renderMain();
    }

    function renderAgentActivity() {
      const pending = Object.entries(pendingConfirmations || {});
      const logs = Object.entries(agentLogs || {})
        .map(([id, l]) => ({ id, ...l }))
        .sort((a, b) => String(b.timestamp || '').localeCompare(String(a.timestamp || '')));

      const botTx = (transactions || []).filter(t => t && t.source && String(t.source).startsWith('telegram'));

      let html = `
        <div class="card">
          <h2>CFO Agent</h2>
          <p class="text-muted" style="font-size: 13px;">Five agents share this database with you. Anything they log or decide appears here and in your transactions.</p>
          <div style="display:flex;flex-wrap:wrap;gap:1.5rem;margin:1rem 0 0.5rem;">
            <div><div class="text-muted" style="font-size:11px;">Logged by agents</div><div style="font-weight:700;font-size:20px;">${botTx.length}</div></div>
            <div><div class="text-muted" style="font-size:11px;">Agent runs</div><div style="font-weight:700;font-size:20px;">${logs.length}</div></div>
            <div><div class="text-muted" style="font-size:11px;">Needs confirming</div><div style="font-weight:700;font-size:20px;color:${pending.length ? 'var(--warning-text2)' : 'inherit'};">${pending.length}</div></div>
          </div>
          ${renderAgentPipeline()}
        </div>

        <div class="card">
          <h2>The agents</h2>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0.85rem;margin-top:0.75rem;">
            ${AGENT_META.map(a => {
              const mine = logs.filter(l => l.agent === a.id);
              const last = mine[0];
              const live = !!last;
              const lastText = last ? (last.summary || (typeof last.output === 'object' && last.output ? last.output.headline : last.output) || '') : '';
              return `<div style="border:1px solid var(--border);border-radius:10px;padding:0.85rem;background:var(--card);">
                <div class="flex-between" style="align-items:flex-start;gap:0.5rem;">
                  <div style="font-weight:700;font-size:13.5px;">${a.label}</div>
                  <span style="display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-muted);white-space:nowrap;">
                    <span style="width:7px;height:7px;border-radius:50%;background:${live ? 'var(--success)' : 'var(--border)'};display:inline-block;"></span>
                    ${live ? timeAgo(last.timestamp) : 'not run yet'}
                  </span>
                </div>
                <div class="text-muted" style="font-size:11.5px;margin:0.3rem 0 0.5rem;">${a.role}</div>
                <div style="font-size:10.5px;color:var(--text-muted);">${mine.length} run${mine.length === 1 ? '' : 's'} · replies tagged <code>${escapeAgentText(a.tag)}</code></div>
                ${lastText ? `<div style="margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid var(--border);font-size:11.5px;white-space:pre-wrap;">${escapeAgentText(String(lastText).slice(0, 180))}</div>` : ''}
              </div>`;
            }).join('')}
          </div>
        </div>`;

      logs.splice(25);

      html += renderEmergencyFundCard();
      html += renderDecisionsCard();

      if (pending.length) {
        html += `<div class="card"><h2>Needs confirming</h2>
          <p class="text-muted" style="font-size:13px;">The bot wasn't confident enough to log these automatically. Approve or reject them here, or reply <strong>confirm &lt;id&gt;</strong> in Telegram.</p>`;
        pending.forEach(([id, p]) => {
          const d = (p && p.data) || {};
          const known = d.amount != null && d.amount !== '';
          html += `<div style="padding:0.85rem 0;border-bottom:1px solid var(--border);">
            <div style="font-weight:600;">${known ? AUD(d.amount) : 'Amount unreadable'} — ${escapeAgentText(d.category || 'uncategorised')}</div>
            <div class="text-muted" style="font-size:12px;">${escapeAgentText(d.merchant || d.name || 'unknown merchant')} · ${escapeAgentText(p.type || '')} · ${escapeAgentText(String(p.createdAt || '').slice(0, 10))}</div>
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-top:0.6rem;">
              <input type="number" id="pendAmt_${id}" value="${known ? d.amount : ''}" placeholder="Amount" min="0" step="0.01" style="max-width:130px;">
              <select id="pendCat_${id}" style="max-width:170px;">${expenseCategoryOptions(d.category || 'Other')}</select>
              <button class="btn-primary btn-small" onclick="approvePending('${id}')">Approve</button>
              <button class="btn-secondary btn-small" onclick="rejectPending('${id}')">Reject</button>
            </div>
            ${!known ? `<div class="text-muted" style="font-size:11px;margin-top:0.4rem;">The agent couldn't read an amount — type it in before approving.</div>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      html += `<div class="card"><h2>Recent agent runs</h2>`;
      if (!logs.length) {
        html += `<p class="text-muted">Nothing logged yet. Agents record a run each time they handle something — text the bot, send it a receipt, or wait for Sunday's briefing.</p>`;
      } else {
        logs.forEach(l => {
          // Two shapes exist: per-run entries carry `summary`, while the weekly
          // briefing writes `output` (a string, or the CFO's directive object).
          const out = l.summary != null
            ? l.summary
            : (typeof l.output === 'object' && l.output !== null
                ? [l.output.headline, l.output.fullBriefing].filter(Boolean).join('\n\n')
                : l.output);
          const meta = AGENT_META.find(a => a.id === l.agent);
          const failed = l.ok === false;
          html += `<div style="padding:0.85rem 0;border-bottom:1px solid var(--border);">
            <div class="flex-between" style="margin-bottom:0.35rem;gap:0.5rem;">
              <span style="display:flex;align-items:center;gap:0.5rem;min-width:0;">
                <span class="badge ${failed ? 'badge-danger' : 'badge-neutral'}">${escapeAgentText(meta ? meta.label : (l.agent || 'agent'))}</span>
                ${l.action ? `<span class="text-muted" style="font-size:11px;">${escapeAgentText(l.action)}</span>` : ''}
              </span>
              <span class="text-muted" style="font-size:11px;white-space:nowrap;">${timeAgo(l.timestamp)}</span>
            </div>
            <div style="font-size:13px;white-space:pre-wrap;">${escapeAgentText(out) || '<span class="text-muted">no output recorded</span>'}</div>
          </div>`;
        });
      }
      html += `</div>`;
      return html;
    }

    function renderMain() {
      let html = '';
      switch (currentTab) {
        case 'dashboard': html = renderDashboard(); break;
        case 'payplan': html = renderPayPlan(); break;
        case 'transactions': html = renderTransactions(); break;
        case 'bills': html = renderBillsTab(); break;
        case 'debts': html = renderDebtsTab(); break;
        case 'budget': html = renderBudget(); break;
        case 'savingsrate': html = renderProgressTab(); break;
        case 'goals': html = renderGoals(); break;
        case 'checklist': html = renderChecklistsTab(); break;
        case 'afford': html = renderToolsTab(); break;
        case 'spending': html = renderInsightsTab(); break;
        case 'agents': html = renderAgentActivity(); break;
        case 'settings': html = renderSettings(); break;
      }
      const content = document.getElementById('mainContent');
      content.innerHTML = html;
      // Transaction filters are wired inline via refreshTxView(), which also
      // refreshes the month totals. The old listener here only redrew the first
      // tbody on the page and knew nothing about the month picker or summary.
      if (currentTab === 'debts') {
        setTimeout(() => {
          const slider = document.getElementById('extraPayment');
          if (slider) {
            slider.addEventListener('input', updateSimulator);
            updateSimulator();
          }
        }, 0);
      }
      if (currentTab === 'budget') {
        setTimeout(() => renderBudgetCharts(), 0);
      }
      if (currentTab === 'savingsrate') {
        setTimeout(() => { renderSavingsRateChart(); renderSavingsProjectionChart(); renderNetWorthChart(); }, 0);
      }
      if (currentTab === 'spending' && insightsView === 'trends') {
        setTimeout(() => renderTrendCharts(), 0);
      }
    }
    function renderAll() { renderHeader(); renderMain(); }

    // Insights (Spending / Trends / Monthly Health / Subscriptions)
    function renderInsightsTab() {
      const views = [
        { id: 'spending', label: 'Spending' },
        { id: 'trends', label: 'Trends' },
        { id: 'monthlyhealth', label: 'Monthly Health' },
        { id: 'subscriptions', label: 'Subscriptions' }
      ];
      const toggle = `
        <div class="card">
          <div class="toggle-group">
            ${views.map(v => `<button class="toggle-btn ${insightsView === v.id ? 'active' : ''}" onclick="setInsightsView('${v.id}')">${v.label}</button>`).join('')}
          </div>
        </div>`;
      let body;
      switch (insightsView) {
        case 'trends': body = renderTrends(); break;
        case 'monthlyhealth': body = renderMonthlyHealth(); break;
        case 'subscriptions': body = renderSubscriptions(); break;
        default: body = renderSpendingCategory();
      }
      return toggle + body;
    }
    // Spending by Category
    function renderSpendingCategory() {
      const monthKey = getMonthKey();
      const monthLabel = new Date().toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
      const monthExpenses = transactions.filter(t => t.type === 'expense' && getMonthKey(new Date(t.date + 'T00:00:00')) === monthKey);
      const byCat = {};
      monthExpenses.forEach(t => {
        const cat = t.category || 'Other';
        byCat[cat] = (byCat[cat] || 0) + t.amount;
      });
      const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
      const total = sorted.reduce((s, [,a]) => s + a, 0);
      return `
        <div class="card">
          <h2>Spending by Category — ${monthLabel}</h2>
          <p class="text-muted">Where your money actually goes</p>

          ${sorted.length === 0 ? '<p class="text-muted" style="text-align: center; padding: 2rem;">No expenses this month</p>' : `
            <div style="display: grid; gap: 1rem;">
              ${sorted.map(([cat, amt]) => {
                const pct = (amt / total) * 100;
                return `
                  <div style="background: var(--bg); padding: 1.25rem; border-radius: 8px;">
                    <div class="flex-between" style="margin-bottom: 0.75rem;">
                      <span style="font-weight: 600;">${cat}</span>
                      <span class="num" style="font-weight: 700;">${AUD(amt)}</span>
                    </div>
                    <div class="progress" style="height: 8px; margin-bottom: 0.5rem;">
                      <div class="progress-fill" style="width: ${pct}%;"></div>
                    </div>
                    <div class="flex-between" style="font-size: 12px; color: #666;">
                      <span>${Math.round(pct)}% of spending</span>
                      <span>${monthExpenses.filter(t => t.category === cat).length} transactions</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    // Monthly Financial Health Check
    function renderMonthlyHealth() {
      const monthKey = getMonthKey();
      const monthLabel = new Date().toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
      const inc = monthlyIncome();
      const bills = monthlyBillsTotal();
      const debt = monthlyDebtMin();
      const exp = transactions.filter(t => t.type === 'expense' && getMonthKey(new Date(t.date + 'T00:00:00')) === monthKey).reduce((s, t) => s + t.amount, 0);
      const surplus = inc - exp;
      const debtProgress = totalDebt() > 0 ? ((initialDebt || totalDebt()) - totalDebt()) / (initialDebt || 1) * 100 : 0;
      return `
        <div class="card" style="background: linear-gradient(135deg, var(--text) 0%, #2C2C2E 100%); color: white; border-radius: 16px;">
          <h2 style="color: white; margin-bottom: 0.5rem;">Monthly Financial Health</h2>
          <p style="opacity: 0.8; font-size: 13px;">Your financial snapshot for ${monthLabel}</p>
        </div>

        <div class="card">
          <h2>This Month's Metrics</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
            <div style="background: var(--surface); padding: 1.25rem; border-radius: 8px; border-left: 4px solid var(--accent);">
              <div class="text-muted" style="font-size: 12px; margin-bottom: 0.5rem;">Income</div>
              <div class="num" style="font-size: 20px; font-weight: 700; color: var(--accent);">${AUD(inc)}</div>
            </div>
            <div style="background: var(--surface); padding: 1.25rem; border-radius: 8px; border-left: 4px solid var(--warning);">
              <div class="text-muted" style="font-size: 12px; margin-bottom: 0.5rem;">Expenses</div>
              <div class="num" style="font-size: 20px; font-weight: 700; color: #D97706;">${AUD(exp)}</div>
            </div>
            <div style="background: var(--surface); padding: 1.25rem; border-radius: 8px; border-left: 4px solid var(--success);">
              <div class="text-muted" style="font-size: 12px; margin-bottom: 0.5rem;">Surplus</div>
              <div class="num" style="font-size: 20px; font-weight: 700; color: #30B650;">${AUD(surplus)}</div>
            </div>
            <div style="background: var(--surface); padding: 1.25rem; border-radius: 8px; border-left: 4px solid var(--purple);">
              <div class="text-muted" style="font-size: 12px; margin-bottom: 0.5rem;">Debt Paid Down</div>
              <div class="num" style="font-size: 20px; font-weight: 700; color: var(--purple-dark);">${Math.round(debtProgress)}%</div>
            </div>
          </div>

          <h3>Health Status</h3>
          <div style="display: grid; gap: 0.75rem;">
            <div class="flex-between" style="padding: 1rem; background: ${surplus >= 0 ? 'var(--surface)' : 'var(--surface)'}; border-radius: 8px;">
              <span>Savings Status</span>
              <span style="font-weight: 700; color: ${surplus >= 0 ? 'var(--success)' : 'var(--danger)'};">${surplus >= 0 ? '✓ Saving' : '⚠ Overspending'}</span>
            </div>
            <div class="flex-between" style="padding: 1rem; background: ${bills + debt <= inc * 0.7 ? 'var(--surface)' : 'var(--surface)'}; border-radius: 8px;">
              <span>Bills + Debt Coverage</span>
              <span style="font-weight: 700; color: ${bills + debt <= inc * 0.7 ? 'var(--success)' : 'var(--danger)'};">${Math.round((bills + debt) / inc * 100)}% of income</span>
            </div>
            <div class="flex-between" style="padding: 1rem; background: ${totalDebt() > 0 ? 'var(--surface)' : 'var(--surface)'}; border-radius: 8px;">
              <span>Debt Progress</span>
              <span style="font-weight: 700; color: var(--purple-dark);">${totalDebt() > 0 ? `${Math.round(debtProgress)}% progress` : '✓ Debt-free'}</span>
            </div>
          </div>
        </div>
      `;
    }

    // Init
    async function init() {
      try {
        renderTabs();
        await loadData();
      } catch (e) {
        console.error('Init error:', e);
        renderTabs();
        renderAll();
      }
    }
    // init() is triggered from the onAuthStateChanged listener once a user is signed in.
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>
</body>
</html>
